services:
  - type: web
    name: chomp-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # Health check endpoint already defined in index.js as /health
    # Auto-detects Node.js version from package.json engines if specified
    # If not, uses default Node.js version
    envVars:
      # Database - you can use Render's PostgreSQL or your Neon database
      # If using Render's PostgreSQL, uncomment and modify:
      # DATABASE_URL: ${postgresql://chomp_user:chomp_pass@internal-db-hostname.onrender.com/db_name}
      
      # Neon Database (your current setup - keep as-is or update connection string)
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      NEON_DATA_API_URL: ${NEON_DATA_API_URL}
      
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      
      # AI APIs
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL}
      GROQ_MODEL: ${GROQ_MODEL}
      
      # Security
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      
      # Firebase - add as secret separately due to size
      # FIREBASE_SERVICE_ACCOUNT_JSON will be added as a Render secret
      
      # Port
      PORT: 3000